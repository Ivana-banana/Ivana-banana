name: Generate Banana Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Ivana-banana
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7a5f1a&color_dots=#efece2,#fff1b8,#ffe066,#ffd23f,#e8a900
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffd23f&color_dots=#161b22,#3d3511,#7a6514,#c9a21c,#ffd23f
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
